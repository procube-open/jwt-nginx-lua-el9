worker_processes 1;
error_log stderr notice;
pid /tmp/jwt-nginx-lua-test.pid;

events { worker_connections 64; }

http {
    server {
        listen 127.0.0.1:18080;
        location = /test {
            content_by_lua_file /tests/smoke.lua;
        }
        location = /issue {
            set $issuerconf "issue.json";
            content_by_lua_file /etc/nginx/lua/jwtIssue.lua;
        }
        location = /verify {
            set $verifyconf "verify.json";
            set $revokeList "revoke.json";
            access_by_lua_file /etc/nginx/lua/jwtVerify.lua;
            content_by_lua_block { ngx.say(ngx.ctx.verifiedClaim.sub) }
        }
        location /jwt.settings/ {
            internal;
            alias /tests/settings/;
        }
    }
}
